[package]
name = "vira"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json"] }
anyhow = "=1.0.100"
rtrb = "=0.3.2"
libc = "=0.2.177"
sha2 = "=0.10.9"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "=2.8.5", features = ["custom-protocol"] }
cpal = "=0.16.0"

[build-dependencies]
tauri-build = "=2.4.1"
cc = "=1.2.43"
