[package]
name = "vira"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
# Hosted capture verifies patch numbers exactly after the IPC round trip.
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json"] }
anyhow = "=1.0.100"
rtrb = "=0.3.2"
libc = "=0.2.177"
sha2 = "=0.10.9"
truce-rack-clap = { path = "../vendor/truce-rack-clap" }
truce-rack-core = "=1.1.5"
truce-rack-vst3 = { path = "../vendor/truce-rack-vst3" }
teia-kernel = { package = "vira-teia-native", path = "../vendor/teia-native" }

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "=2.8.5", features = ["custom-protocol", "unstable"] }
cpal = "=0.16.0"
truce-rack-au = { path = "../vendor/truce-rack-au" }

[build-dependencies]
tauri-build = "=2.4.1"
cc = "=1.2.43"
