[package]
name = "vira-audio-spike"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "=1.0.100"
cpal = "=0.16.0"
hound = "=3.5.1"
rtrb = "=0.3.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
libc = "=0.2.177"

[features]
host = ["dep:tauri", "tauri/custom-protocol", "dep:tauri-build"]

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "=2.8.5", optional = true }

[build-dependencies]
cc = "=1.2.43"
tauri-build = { version = "=2.4.1", optional = true }

[profile.release]
debug = 1
